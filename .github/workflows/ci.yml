name: 'ci'
on:
  pull_request:
    branches: ['master']
  workflow_dispatch:
  workflow_call:
jobs:
  test-angular-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        angular-version: ['20', '21', '22']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - name: Install @angular/compiler v${{ matrix.angular-version }}
        run: npm install --no-save --legacy-peer-deps @angular/compiler@${{ matrix.angular-version }}
      - run: npm test
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
